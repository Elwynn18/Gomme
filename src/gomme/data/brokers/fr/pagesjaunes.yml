notes: |-
  Solocal édite aussi le 118 712 (118712.fr), dont les données « proviennent du site
  pagesjaunes.fr » (https://www.118712.fr/politique-cookies) : une seule demande couvre les deux.
  La page demande de « préciser votre besoin ainsi que le support (pagesjaunes) ».
  Solocal peut demander « un justificatif simple tel une facture à votre nom ».
  Suppression effective sous 48 à 72 h ; en cas de refus de parution, les données sont
  conservées « afin d'éviter toute nouvelle parution ».
  Seul votre opérateur gère vos choix de parution (liste rouge, anti-prospection) :
  voir docs/opposition-fr.md.
  Relevé le 2026-10-25 (recherche assistée) sur la page source_ref, les mentions légales
  et https://www.pagesjaunes.fr/infoslegales/toutsurvosdonnees/.
