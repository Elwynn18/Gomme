slug: infobel
name: Infobel (INFOBEL SA, ex-Kapitol)
domain: infobel.com
country: BE
region: fr
category: annuaire
channels:
  # « Vous pouvez exercer vos droits … en complétant le formulaire accessible sur la page
  # dpo.infobel.com ». La page ne donne pas d'adresse email.
  - type: web_form
    url: https://dpo.infobel.com/?languageCode=fr
  - type: postal
    address: "DPO – INFOBEL SA, Avenue Louise 231, 1050 Bruxelles, Belgique"
legal_basis: [gdpr_art17, gdpr_art21]
required_fields: [full_name, email, postal_address, phone]
fields_why:
  full_name: "Pour les particuliers, l'annuaire traite les « Données d'identification personnelle (nom, prénom, adresse, numéro de téléphone, adresse email) » ; nom et prénom sont obligatoires dans le formulaire du DPO (https://www.infobel.com/fr/france/Landing/PersonalDataProtection)."
  email: "La demande passe par « le formulaire accessible sur la page dpo.infobel.com », où l'email est un champ obligatoire ; il sert aussi à recevoir la réponse (https://www.infobel.com/fr/france/Landing/PersonalDataProtection)."
  postal_address: "L'annuaire range les particuliers par « nom, prénom, adresse, numéro de téléphone » ; rue, code postal et ville sont obligatoires dans le formulaire du DPO (https://www.infobel.com/fr/france/Landing/PersonalDataProtection)."
  phone: "Le téléphone est un champ obligatoire du formulaire du DPO, relevé le 2026-10-25 (https://dpo.infobel.com/?languageCode=fr) ; l'annuaire range les particuliers par « nom, prénom, adresse, numéro de téléphone »."
requires_id: true
language: fr
source: manual
source_ref: https://www.infobel.com/fr/france/Landing/PersonalDataProtection
last_verified: 2026-10-25
notes: |-
  Société belge, rangée en région fr : elle publie l'annuaire français (infobel.com/fr/france).
  Annuaire alimenté par les opérateurs téléphoniques ; Infobel vend aussi ces données
  « à des fins de marketing ou marketing direct ».
  La page exige une pièce d'identité avec toute demande (« doit être accompagné de la copie
  d'une pièce justificative d'identité ») : la caviarder (garder nom, prénom et photo,
  masquer numéro, date de naissance et signature). Une demande par une adresse non listée
  dans la politique n'est pas traitée.
  Politique mise à jour le 15 mars 2023 ; relevé le 2026-10-25 (recherche assistée).
