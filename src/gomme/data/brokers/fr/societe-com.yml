fields_why:
  full_name: "Estimation : le site publie les dirigeants sous leur nom ; la page ne liste pas les informations à fournir, mais exige « un justificatif d'identité » (https://www.societe.com/pages/politique-de-protection-des-donnees-personnelles.html)."
  email: "Estimation : pour vous identifier et recevoir la réponse ; la page ne précise pas les informations à fournir."
requires_id: true
language: fr
source: manual
source_ref: https://www.societe.com/pages/politique-de-protection-des-donnees-personnelles.html
last_verified: 2026-10-25
notes: |-
  Publie les données des dirigeants et entrepreneurs issues des registres publics.
  La page exige une pièce d'identité (« Toute demande devra être accompagnée d'un
  justificatif d'identité ») et dit la supprimer sous 24 h : la caviarder.
  L'effacement ne vaut que pour le site (« effacera seulement de son Site les Données
  Personnelles visée par votre demande »). Pour les données issues de SIRENE, Societe.com
  renvoie à l'opposition auprès de l'INSEE (art. R123-232-1 du Code de commerce), qu'il
  répercute sous 24 h.
  Relevé le 2026-10-25 (recherche assistée). Adresse du siège : mentions légales.
