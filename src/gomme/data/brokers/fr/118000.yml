notes: |-
  Édite annuaire.118000.fr (particuliers) et annuaire-inverse.118000.fr (recherche par
  numéro).
  La page demande « les éléments nécessaires à votre identification (nom, prénom, email) ».
  Le site propose aussi un chatbot pour « supprimer rapidement vos données personnelles »
  (https://www.118000.fr/faq.html).
